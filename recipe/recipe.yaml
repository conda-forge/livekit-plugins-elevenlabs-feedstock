schema_version: 1

context:
  version: 1.8.12

package:
  name: livekit-plugins-elevenlabs
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/4b/ef/19d91b5bfe6ee556ff05e5c262811ab36ee23faf4f6e3bbc9aa89fc241ec/livekit_plugins_elevenlabs-${{ version }}.tar.gz
    sha256: 384d85badbae3ede2dded6fbbadd12d1cd3450cc98f651828ad3ed22ef4105f6
  - url: https://raw.githubusercontent.com/livekit/agents/refs/tags/livekit-agents%40${{ version }}/LICENSE
    sha256: c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - livekit-agents >=1.8.12
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - livekit.plugins.elevenlabs
      pip_check: true

about:
  summary: Agent Framework plugin for voice synthesis with ElevenLabs' API.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/livekit-plugins-elevenlabs/
  repository: https://github.com/livekit/agents
  documentation: https://docs.livekit.io

extra:
  recipe-maintainers:
    - conda-forge/livekit
